info:
  name: "List with repeated after"
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/inventory?after=A&after=B"
  params:
    - name: "after"
      value: "A"
      type: query
    - name: "after"
      value: "B"
      type: query
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("400 text/plain \"Invalid request\"", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getHeader('content-type')).to.match(/^text\/plain/);
          expect(res.getBody()).to.equal("Invalid request");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Z3: a repeated after is ambiguous, so 400 text/plain 'Invalid request'.
