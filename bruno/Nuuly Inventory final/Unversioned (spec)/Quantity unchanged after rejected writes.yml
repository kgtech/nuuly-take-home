info:
  name: "Quantity unchanged after rejected writes"
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseUrl}}/inventory/{{skuId}}"
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("200 with JSON", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('content-type')).to.match(/^application\/json/);
        });
        test("quantity equals the saved value", function () {
          expect(res.getBody().quantity).to.equal(bru.getVar('expectedQty'));
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Proves the rejected writes above (invalid skuId, malformed JSON, quantity 0, XML Accept) wrote nothing: this run's SKU still has the saved quantity 3.
