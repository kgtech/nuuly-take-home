info:
  name: "Purchase with new key"
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/v2/inventory/{{skuId}}/purchase"
  headers:
    - name: "Idempotency-Key"
      value: "{{purchaseKey}}"
  body:
    type: json
    data: |-
      {
        "quantity": 2
      }
  auth:
    type: none
runtime:
  scripts:
    - type: before-request
      code: |-
        const uuid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
        bru.setVar('purchaseKey', uuid());
    - type: after-response
      code: |-
        bru.setVar('purchaseBody', JSON.stringify(res.getBody()));
    - type: tests
      code: |-
        test("200 with JSON", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('content-type')).to.match(/^application\/json/);
        });
        test("quantity 3", function () {
          expect(res.getBody()).to.deep.equal({ skuId: bru.getVar('skuId'), quantity: 3 });
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  /v2 purchase with a new key: 200 SkuItem, 5 - 2 = 3 (the rejected calls above changed nothing).
