info:
  name: "First page (limit 1)"
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/v2/inventory?limit=1&after={{pageAfter}}"
  params:
    - name: "limit"
      value: "1"
      type: query
    - name: "after"
      value: "{{pageAfter}}"
      type: query
  auth:
    type: none
runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar('seen', '[]');
    - type: after-response
      code: |-
        const link = res.getHeader('link') || '';
        const m = link.match(/<([^>]+)>;\s*rel="next"/);
        bru.setVar('nextUrl', m ? m[1] : '');
        const seen = JSON.parse(bru.getVar('seen') || '[]');
        res.getBody().forEach(i => seen.push(i.skuId));
        bru.setVar('seen', JSON.stringify(seen));
    - type: tests
      code: |-
        test("200 with JSON", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('content-type')).to.match(/^application\/json/);
        });
        test("one row, ascending, matching the seeded IDs so far", function () {
          expect(res.getBody().length).to.equal(1);
          const seen = JSON.parse(bru.getVar('seen'));
          expect(seen).to.deep.equal(JSON.parse(bru.getVar('seedIds')).slice(0, seen.length));
        });
        test("a Link to the next page", function () {
          expect(res.getHeader('link')).to.match(/<[^>]+>;\s*rel="next"/);
        });
        test("Link carries limit=1 and after", function () {
          const link = res.getHeader('link');
          expect(link).to.match(/limit=1/);
          expect(link).to.match(/after=/);
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  limit shrinks the page; after starts just below this run's first seeded SKU. The Link header carries limit and after; the next-page URL is saved from it.
