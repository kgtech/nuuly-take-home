info:
  name: "Same key, different quantity"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v2/inventory/{{skuId}}"
  headers:
    - name: "Idempotency-Key"
      value: "{{idemKey}}"
  body:
    type: json
    data: |-
      {
        "quantity": 6
      }
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("400 text/plain \"Invalid request\"", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getHeader('content-type')).to.match(/^text\/plain/);
          expect(res.getBody()).to.equal("Invalid request");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Y3, S8: the same key with another quantity is 400 'Invalid request'.
