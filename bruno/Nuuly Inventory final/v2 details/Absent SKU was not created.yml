info:
  name: "Absent SKU was not created"
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/v2/inventory/{{detailSku}}-ABSENT"
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("404 text/plain \"SKU not found\"", function () {
          expect(res.getStatus()).to.equal(404);
          expect(res.getHeader('content-type')).to.match(/^text\/plain/);
          expect(res.getBody()).to.equal("SKU not found");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Proves the If-Match PUT on an absent SKU wrote nothing: the SKU still does not exist (404 'SKU not found').
