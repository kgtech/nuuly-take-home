info:
  name: "Add with Idempotency-Key (OD-4)"
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/inventory/{{skuId}}"
  headers:
    - name: "Idempotency-Key"
      value: "{{idemKey}}"
  body:
    type: json
    data: |-
      {
        "quantity": 5
      }
  auth:
    type: none
runtime:
  scripts:
    - type: before-request
      code: |-
        const uuid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
        bru.setVar('idemKey', uuid());
    - type: tests
      code: |-
        test("400 text/plain \"Invalid request\"", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getHeader('content-type')).to.match(/^text\/plain/);
          expect(res.getBody()).to.equal("Invalid request");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  OD-4 (README 'Deviations'): the unversioned POST refuses any Idempotency-Key with 400 'Invalid request' and writes nothing (the next request shows the stock is still 3).
