info:
  name: "Last page (from Link)"
  type: http
  seq: 8

http:
  method: GET
  url: "{{nextUrl}}"
  auth:
    type: none
runtime:
  scripts:
    - type: after-response
      code: |-
        const link = res.getHeader('link') || '';
        const m = link.match(/<([^>]+)>;\s*rel="next"/);
        bru.setVar('nextUrl', m ? m[1] : '');
        const seen = JSON.parse(bru.getVar('seen') || '[]');
        res.getBody().forEach(i => seen.push(i.skuId));
        bru.setVar('seen', JSON.stringify(seen));
    - type: tests
      code: |-
        test("200 with JSON", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('content-type')).to.match(/^application\/json/);
        });
        test("one row, ascending, matching the seeded IDs so far", function () {
          expect(res.getBody().length).to.equal(1);
          const seen = JSON.parse(bru.getVar('seen'));
          expect(seen).to.deep.equal(JSON.parse(bru.getVar('seedIds')).slice(0, seen.length));
        });
        test("no Link header on the last page", function () {
          expect(res.getHeader('link')).to.equal(undefined);
        });
        test("the four seeded SKUs were walked in order", function () {
          expect(JSON.parse(bru.getVar('seen'))).to.deep.equal(JSON.parse(bru.getVar('seedIds')));
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Follows the Link URL of the third page: the fourth seeded SKU is the last row of the database, so there is no Link, and the four pages together were exactly the four seeded SKUs in order. (Assumes no SKU ID sorts after ZZ-BR-..., e.g. a later collection run or a lowercase ID.)
