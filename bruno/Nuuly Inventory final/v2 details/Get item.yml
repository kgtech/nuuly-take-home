info:
  name: "Get item"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/v2/inventory/{{detailSku}}"
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("200 with JSON", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('content-type')).to.match(/^application\/json/);
        });
        test("ETag \"2\" and Cache-Control no-store", function () {
          expect(res.getHeader('etag')).to.equal('"2"');
          expect(res.getHeader('cache-control')).to.match(/no-store/);
        });
        test("details of the replace", function () {
          expect(res.getBody().details.name).to.equal('Linen shirt, navy');
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  GET item: the ETag is the current details version and Cache-Control is no-store.
