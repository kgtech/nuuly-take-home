name: CI

on:
  push:
    branches: [final]
  pull_request:
    branches: [final]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Service (Gradle, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  frontend:
    name: Front end (lint, typecheck, check:api, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:api
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end (compose stack, Playwright)
    runs-on: ubuntu-latest
    needs: [service, frontend]
    env:
      APP_PORT: '8080'
      API_URL: http://localhost:8080
      VITE_PORT: '5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the stack
        run: docker compose up --build -d
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health/readiness || true)
            [ "$code" = 200 ] && exit 0
            sleep 3
          done
          docker compose logs app | tail -100
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color | tail -300
