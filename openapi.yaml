openapi: 3.1.0
info:
  title: Inventory API
  version: 1.0.0
servers:
- description: Generated server url
  url: http://localhost:8080
paths:
  /inventory:
    get:
      operationId: listInventory
      parameters:
      - description: "Optional page size, 1 to 250. Larger values mean 250; other\
          \ values are ignored."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          maximum: 250
          minimum: 1
      - description: "Optional cursor: return only SKUs whose skuId sorts after this\
          \ value. It must not be repeated."
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
          description: List of all inventory items
          headers:
            Link:
              description: "Next page, when there is one: <URL>; rel=\"next\""
              schema:
                type: string
              style: simple
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: "Invalid request: the query string can't be decoded or repeats\
            \ after"
      summary: List all inventory
      tags:
      - inventory
  /inventory/{skuId}:
    get:
      operationId: getInventory
      parameters:
      - in: path
        name: skuId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
          description: Current inventory state for the sku
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: SKU not found
      summary: Get inventory for a SKU
      tags:
      - inventory
    post:
      operationId: createInventory
      parameters:
      - in: path
        name: skuId
        required: true
        schema:
          type: string
      - description: "Optional UUID. The same key with the same request replays the\
          \ first response. A different request, or a key older than 24h, returns\
          \ 400."
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryQuantity"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
          description: Current state of the item after update
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Invalid request
      summary: Create or update inventory for a SKU
      tags:
      - inventory
  /inventory/{skuId}/purchase:
    post:
      operationId: purchaseItem
      parameters:
      - in: path
        name: skuId
        required: true
        schema:
          type: string
      - description: "Optional UUID. The same key with the same request replays the\
          \ first response. A different request, or a key older than 24h, returns\
          \ 400."
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryQuantity"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
          description: Purchase successful; remaining inventory for the item
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Insufficient inventory or invalid request
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: SKU not found
      summary: Purchase a quantity of a SKU
      tags:
      - inventory
components:
  schemas:
    InventoryItem:
      type: object
      properties:
        quantity:
          type: integer
          format: int64
        skuId:
          type: string
    InventoryQuantity:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
      required:
      - quantity
