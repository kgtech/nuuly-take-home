info:
  name: "Invalid limit is ignored"
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/v2/inventory?limit=0"
  params:
    - name: "limit"
      value: "0"
      type: query
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("200 with JSON", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('content-type')).to.match(/^application\/json/);
        });
        test("more than one row (default page)", function () {
          expect(res.getBody().length).to.be.above(1);
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  R4: a limit below 1 (or non-numeric) is ignored, so the default page of up to 250 applies.
