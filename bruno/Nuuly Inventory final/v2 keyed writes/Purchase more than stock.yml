info:
  name: "Purchase more than stock"
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/v2/inventory/{{skuId}}/purchase"
  headers:
    - name: "Idempotency-Key"
      value: "{{key3}}"
  body:
    type: json
    data: |-
      {
        "quantity": 20
      }
  auth:
    type: none
runtime:
  scripts:
    - type: before-request
      code: |-
        const uuid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
        bru.setVar('key3', uuid());
    - type: tests
      code: |-
        test("400 text/plain \"Insufficient inventory\"", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getHeader('content-type')).to.match(/^text\/plain/);
          expect(res.getBody()).to.equal("Insufficient inventory");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  G6 on /v2: 400 'Insufficient inventory' with a fresh key.
