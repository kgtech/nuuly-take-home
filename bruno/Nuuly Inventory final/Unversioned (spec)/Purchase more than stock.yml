info:
  name: "Purchase more than stock"
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/inventory/{{skuId}}/purchase"
  body:
    type: json
    data: |-
      {
        "quantity": 10
      }
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("400 text/plain \"Insufficient inventory\"", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getHeader('content-type')).to.match(/^text\/plain/);
          expect(res.getBody()).to.equal("Insufficient inventory");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  G6: more than the stock is 400 text/plain 'Insufficient inventory'; the count is never in the body. Stock stays 3.
