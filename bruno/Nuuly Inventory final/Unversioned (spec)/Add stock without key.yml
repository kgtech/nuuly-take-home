info:
  name: "Add stock without key"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/inventory/{{skuId}}"
  body:
    type: json
    data: |-
      {
        "quantity": 5
      }
  auth:
    type: none
runtime:
  scripts:
    - type: before-request
      code: |-
        const stamp = Date.now().toString(36).toUpperCase();
        bru.setVar('skuId', 'BR-' + stamp);
        bru.setVar('skuId2', 'BR-' + stamp + '-B');
    - type: tests
      code: |-
        test("200 with JSON", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('content-type')).to.match(/^application\/json/);
        });
        test("returns skuId and quantity 5", function () {
          const b = res.getBody();
          expect(b.skuId).to.equal(bru.getVar('skuId'));
          expect(b.quantity).to.equal(5);
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Spec API add, no Idempotency-Key (G8): 200 with the new quantity. Setup: picks fresh skuId and skuId2 for this run.
