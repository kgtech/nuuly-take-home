info:
  name: "Quantity zero"
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/inventory/{{skuId}}"
  body:
    type: json
    data: |-
      {
        "quantity": 0
      }
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("400 text/plain \"Invalid request\"", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getHeader('content-type')).to.match(/^text\/plain/);
          expect(res.getBody()).to.equal("Invalid request");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  G4, V2: quantity must be 1 to 2147483647, so 0 is 400 'Invalid request'.
