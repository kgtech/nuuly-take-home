info:
  name: "List with limit ignored"
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/inventory?limit=1"
  params:
    - name: "limit"
      value: "1"
      type: query
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("200 with JSON", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('content-type')).to.match(/^application\/json/);
        });
        test("limit=1 is ignored: more than one row", function () {
          expect(res.getBody().length).to.be.above(1);
        });
        test("any Link carries after and not limit=1", function () {
          const link = res.getHeader('link');
          if (link) {
            expect(link).to.match(/rel="next"/);
            expect(link).to.match(/after=/);
            expect(link).to.not.match(/limit=1(&|>|$)/);
          }
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  OD-5: the unversioned list ignores limit, so more than one SKU comes back. A Link (only when more than 250 SKUs exist) carries after, never limit=1.
