openapi: 3.1.0
info:
  description: "The take-home spec's API, with these deviations: GET /inventory returns\
    \ at most 250 SKUs per response and pages with the after cursor and the Link header.\
    \ Write operations reject an Idempotency-Key. Idempotent writes, SKU details and\
    \ conditional requests are in the /v2 API (openapi-v2.yaml)."
  title: Inventory API
  version: 1.0.0
servers:
- description: Generated server url
  url: http://localhost:8080
paths:
  /inventory:
    get:
      description: "Returns SKUs sorted by skuId, at most 250 per response. When more\
        \ SKUs follow, the Link header holds the next page's URL (it carries the after\
        \ cursor); follow it until a response has no Link to list all inventory. If\
        \ no SKUs exist, returns an empty array."
      operationId: listInventory
      parameters:
      - description: "Optional exclusive cursor: return only SKUs whose skuId sorts\
          \ after this value, up to 250. It must not be repeated."
        in: query
        name: after
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
          description: "One page of inventory items, at most 250, sorted by skuId;\
            \ the Link header points to the next page after the last skuId"
          headers:
            Link:
              description: "Next page, when more SKUs follow: <URL>; rel=\"next\""
              schema:
                type: string
              style: simple
        "400":
          content:
            text/plain:
              schema:
                type: string
                example: Insufficient inventory
          description: "Invalid request: the query string can't be decoded or repeats\
            \ after"
      summary: List all inventory
      tags:
      - inventory
  /inventory/{skuId}:
    get:
      description: Returns the current quantity on hand for the specified SKU. Returns
        404 if the SKU does not exist.
      operationId: getInventory
      parameters:
      - in: path
        name: skuId
        required: true
        schema:
          type: string
          example: CW-XYCS-BM-01
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
          description: Current inventory state for the sku
        "404":
          content:
            text/plain:
              schema:
                type: string
                example: Insufficient inventory
          description: SKU not found
      summary: Get inventory for a SKU
      tags:
      - inventory
    post:
      description: "Adds stock for the specified SKU. If the SKU does not yet exist\
        \ in inventory, it is created with the given quantity. If it already exists,\
        \ the quantity is added to the current stock. Returns the updated inventory\
        \ state for the SKU."
      operationId: createInventory
      parameters:
      - in: path
        name: skuId
        required: true
        schema:
          type: string
          example: CW-XYCS-BM-01
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryQuantity"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
          description: Current state of the item after update
        "400":
          content:
            text/plain:
              schema:
                type: string
                example: Insufficient inventory
          description: Invalid request
      summary: Create or update inventory for a SKU
      tags:
      - inventory
  /inventory/{skuId}/purchase:
    post:
      description: "Deducts the requested quantity from inventory for the specified\
        \ SKU. The purchase is only allowed if the current stock is sufficient to\
        \ fulfill the full requested quantity. Returns 404 if the SKU does not exist.\
        \ Returns 400 if there is insufficient inventory. On success, returns the\
        \ remaining inventory for the SKU."
      operationId: purchaseItem
      parameters:
      - in: path
        name: skuId
        required: true
        schema:
          type: string
          example: widget
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryQuantity"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
          description: Purchase successful; remaining inventory for the item
        "400":
          content:
            text/plain:
              schema:
                type: string
                example: Insufficient inventory
          description: Insufficient inventory or invalid request
        "404":
          content:
            text/plain:
              schema:
                type: string
                example: Insufficient inventory
          description: SKU not found
      summary: Purchase a quantity of a SKU
      tags:
      - inventory
components:
  schemas:
    InventoryItem:
      type: object
      properties:
        quantity:
          type: integer
          example: 10
          minimum: 0
        skuId:
          type: string
          example: widget
    InventoryQuantity:
      type: object
      properties:
        quantity:
          type: integer
          example: 10
          minimum: 1
      required:
      - quantity
