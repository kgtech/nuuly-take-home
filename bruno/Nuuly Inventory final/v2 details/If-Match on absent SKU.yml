info:
  name: "If-Match on absent SKU"
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/v2/inventory/{{detailSku}}-ABSENT/details"
  headers:
    - name: "If-Match"
      value: "\"1\""
  body:
    type: json
    data: |-
      {
        "name": "Ghost"
      }
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("412 text/plain \"Details changed since you read them. Reload the SKU and retry with its new ETag.\"", function () {
          expect(res.getStatus()).to.equal(412);
          expect(res.getHeader('content-type')).to.match(/^text\/plain/);
          expect(res.getBody()).to.equal("Details changed since you read them. Reload the SKU and retry with its new ETag.");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Any If-Match on a SKU that does not exist is 412 (and creates nothing).
