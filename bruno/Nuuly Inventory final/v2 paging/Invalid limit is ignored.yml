info:
  name: "Invalid limit is ignored"
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/v2/inventory?limit=0&after={{pageAfter}}"
  params:
    - name: "limit"
      value: "0"
      type: query
    - name: "after"
      value: "{{pageAfter}}"
      type: query
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("200 with JSON", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('content-type')).to.match(/^application\/json/);
        });
        test("the four seeded SKUs, in order", function () {
          expect(res.getBody().map(i => i.skuId)).to.deep.equal(JSON.parse(bru.getVar('seedIds')));
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  R4: a limit below 1 (or non-numeric) is ignored, so the default page of up to 250 applies: all four seeded SKUs come back.
