info:
  name: "Create again with If-None-Match"
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/v2/inventory/{{detailSku}}/details"
  headers:
    - name: "If-None-Match"
      value: "*"
  body:
    type: json
    data: |-
      {
        "name": "Other"
      }
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("412 text/plain \"Details changed since you read them. Reload the SKU and retry with its new ETag.\"", function () {
          expect(res.getStatus()).to.equal(412);
          expect(res.getHeader('content-type')).to.match(/^text\/plain/);
          expect(res.getBody()).to.equal("Details changed since you read them. Reload the SKU and retry with its new ETag.");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  If-None-Match: * on an existing SKU is 412 with the fixed text (text/plain).
