info:
  name: "Invalid skuId on create"
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/inventory/-bad"
  body:
    type: json
    data: |-
      {
        "quantity": 1
      }
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("400 text/plain \"Invalid request\"", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getHeader('content-type')).to.match(/^text\/plain/);
          expect(res.getBody()).to.equal("Invalid request");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  G11: an invalid SKU ID where one would be created is 400 'Invalid request'.
