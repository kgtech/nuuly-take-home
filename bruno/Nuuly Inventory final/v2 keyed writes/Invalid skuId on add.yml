info:
  name: "Invalid skuId on add"
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/v2/inventory/-bad"
  headers:
    - name: "Idempotency-Key"
      value: "{{key5}}"
  body:
    type: json
    data: |-
      {
        "quantity": 1
      }
  auth:
    type: none
runtime:
  scripts:
    - type: before-request
      code: |-
        const uuid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
        bru.setVar('key5', uuid());
    - type: tests
      code: |-
        test("400 text/plain \"Invalid request\"", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getHeader('content-type')).to.match(/^text\/plain/);
          expect(res.getBody()).to.equal("Invalid request");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  G11: an invalid SKU ID where one would be created is 400 'Invalid request'.
