info:
  name: "OpenAPI document (unversioned)"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v3/api-docs.yaml/inventory"
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("200 with OpenAPI media type", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('content-type')).to.match(/^application\/vnd\.oai\.openapi/);
        });
        test("YAML document containing /inventory/{skuId}", function () {
          const body = String(res.getBody());
          expect(body).to.match(/^openapi:/m);
          expect(body).to.contain("/inventory/{skuId}");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  README 'API docs': the running service serves the inventory group as YAML; the committed openapi.yaml is regenerated from it.
