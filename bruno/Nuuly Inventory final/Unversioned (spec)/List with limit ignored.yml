info:
  name: "List with limit ignored"
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/inventory?limit=1&after={{listAfter}}"
  params:
    - name: "limit"
      value: "1"
      type: query
    - name: "after"
      value: "{{listAfter}}"
      type: query
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("200 with JSON", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('content-type')).to.match(/^application\/json/);
        });
        test("limit=1 is ignored: both of this run's SKUs are in the page", function () {
          const ids = res.getBody().map(i => i.skuId);
          expect(ids.length).to.be.above(1);
          expect(ids).to.include(bru.getVar('skuId'));
          expect(ids).to.include(bru.getVar('skuId2'));
        });
        test("any Link carries after and not limit=1", function () {
          const link = res.getHeader('link');
          if (link) {
            expect(link).to.match(/rel="next"/);
            expect(link).to.match(/after=/);
            expect(link).to.not.match(/limit=1(&|>|$)/);
          }
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  OD-5: the unversioned list ignores limit, so both of this run's SKUs come back (anchored with the same cursor as 'List inventory'). A Link (only when more than 250 SKUs follow) carries after, never limit=1.
