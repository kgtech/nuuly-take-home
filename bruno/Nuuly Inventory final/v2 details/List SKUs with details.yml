info:
  name: "List SKUs with details"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/v2/inventory?limit=1&after={{detailAfter}}"
  params:
    - name: "limit"
      value: "1"
      type: query
    - name: "after"
      value: "{{detailAfter}}"
      type: query
  auth:
    type: none
runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar('detailAfter', bru.getVar('detailSku').slice(0, -1));
    - type: tests
      code: |-
        test("200 with JSON", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('content-type')).to.match(/^application\/json/);
        });
        test("first row is this run's SKU with its details", function () {
          const b = res.getBody();
          expect(b.length).to.equal(1);
          expect(b[0].skuId).to.equal(bru.getVar('detailSku'));
          expect(b[0].details.name).to.equal('Linen shirt, navy');
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  The /v2 list carries details where a SKU has them. The cursor is this SKU's ID minus its last character, so the first row after it is this SKU.
