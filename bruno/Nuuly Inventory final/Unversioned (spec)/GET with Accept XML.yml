info:
  name: "GET with Accept XML"
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseUrl}}/inventory/{{skuId}}"
  headers:
    - name: "Accept"
      value: "application/xml"
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("200 with JSON", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader('content-type')).to.match(/^application\/json/);
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  U2: GET ignores Accept, so this is still 200 JSON.
