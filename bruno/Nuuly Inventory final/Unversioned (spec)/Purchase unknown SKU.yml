info:
  name: "Purchase unknown SKU"
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/inventory/{{skuId}}-NOPE/purchase"
  body:
    type: json
    data: |-
      {
        "quantity": 1
      }
  auth:
    type: none
runtime:
  scripts:
    - type: tests
      code: |-
        test("404 text/plain \"SKU not found\"", function () {
          expect(res.getStatus()).to.equal(404);
          expect(res.getHeader('content-type')).to.match(/^text\/plain/);
          expect(res.getBody()).to.equal("SKU not found");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  G6: purchase of a SKU that does not exist is 404 text/plain 'SKU not found'.
