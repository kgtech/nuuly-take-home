info:
  name: "Invalid skuId on purchase"
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/v2/inventory/-bad/purchase"
  headers:
    - name: "Idempotency-Key"
      value: "{{key6}}"
  body:
    type: json
    data: |-
      {
        "quantity": 1
      }
  auth:
    type: none
runtime:
  scripts:
    - type: before-request
      code: |-
        const uuid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
        bru.setVar('key6', uuid());
    - type: tests
      code: |-
        test("404 text/plain \"SKU not found\"", function () {
          expect(res.getStatus()).to.equal(404);
          expect(res.getHeader('content-type')).to.match(/^text\/plain/);
          expect(res.getBody()).to.equal("SKU not found");
        });
settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  G11: an invalid SKU ID on a purchase is 404 'SKU not found'.
