# Postgres only. `./gradlew bootRun` reads this file; `docker compose up --build` also reads
# compose.override.yaml, which adds the app (D8, S4). The postgres tag repeats the catalog's version (S10).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
